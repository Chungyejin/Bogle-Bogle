# 서버 포트 설정 (기본값 8080)
server.port=8080

# MySQL 데이터베이스 연결 정보
# 데이터베이스 이름
spring.datasource.url=jdbc:mysql://localhost:3306/bogle_bogle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# MySQL 사용자 이름
spring.datasource.username=root

# MySQL 비밀번호
spring.datasource.password = yejin0913

# 데이터베이스 드라이버 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정 (테이블 자동 생성 및 관리)
#update: 기존 테이블이 있으면 유지하고, 엔티티에 변경사항이 있으면 반영합니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
