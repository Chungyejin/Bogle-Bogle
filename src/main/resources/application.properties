# 서버 포트 설정
server.port=8080

# MySQL 데이터베이스 연결 정보
spring.datasource.url=jdbc:mysql://localhost:3306/bogle_bogle?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# 수정: bogleuser로 변경
spring.datasource.username=bogleuser
spring.datasource.password=yejin0913

# 데이터베이스 드라이버 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정 (SQL 출력 및 테이블 업데이트)
