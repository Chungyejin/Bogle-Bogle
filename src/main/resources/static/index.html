<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보글보글 재료마을 - 홈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <main id="page-home" class="page-view">
        <header class="ac-header">
            <div class="ac-title-box">
                <h1>🍲 보글보글 재료마을 🍲</h1>
                <p>냉장고를 열고 재료를 넣어봐요! 주방에서 레시피를 찾아봐요</p>
            </div>
        </header>

        <div class="home-menu-grid">
            <!-- 냉장고 카드 클릭 시 refrigerator.html 로 이동 -->
            <div class="ac-card home-card" onclick="location.href='refrigerator.html'">
                <div class="home-card-icon"><img src="img/냉장고.png" alt="냉장고 사진"></div>
                <h2>내 냉장고</h2>
                <p>재료를 추가하고 싱싱하게 관리해요!</p>
            </div>

            <!-- 주방 카드 클릭 시 kitchen.html 로 이동 -->
            <div class="ac-card home-card" onclick="location.href='kitchen.html'">
                <div class="home-card-icon"><img src="img/주방.png" alt="주방 사진"></div>
                <h2>주방</h2>
                <p>재료로 만들 수 있는 레시피를 찾고 등록해요!</p>
            </div>
        </div>
    </main>
</div>

</body>
</html>
