<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보글보글 재료마을</title>
    <!-- 구글 폰트 적용 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- GNB 상단 바 (홈 화면이 아닐 때 표시) -->
    <nav id="top-nav" class="top-nav hidden">
        <button class="btn-outline" onclick="showPage('home')">← 마을로 돌아가기</button>
        <span id="nav-title" class="nav-title"></span>
    </nav>

    <!-- ================= 1. 홈 화면 (마을) ================= -->
    <main id="page-home" class="page-view">
        <header class="ac-header">
            <div class="ac-title-box">
                <h1>🍲 보글보글 재료마을 🍲 </h1>
                <p>냉장고를 열고 재료를 넣어봐요! 주방에서 레시피를 찾아봐요</p>
            </div>
        </header>

        <div class="home-menu-grid">
            <!-- 냉장고 카드 -->
            <div class="ac-card home-card" onclick="showPage('fridge')">
                <div class="home-card-icon"><img src="img/냉장고.png" alt="냉장고 사진 "></div>
                <h2>내 냉장고</h2>
                <p>재료를 추가하고 싱싱하게 관리해요!</p>
            </div>

            <!-- 주방 카드 -->
            <div class="ac-card home-card" onclick="showPage('kitchen')">
                <div class="home-card-icon"><img src="img/주방.png" alt="주방 사진 "></div>
                <h2>주방</h2>
                <p>재료로 만들 수 있는 레시피를 찾고 등록해요!</p>
            </div>
        </div>
    </main>

    <!-- ================= 2. 냉장고 화면 ================= -->
    <main id="page-fridge" class="page-view hidden">
        <div class="grid">
            <section>
                <div class="card ac-card">
                    <h2>🌱 신규 재료 추가</h2>
                    <form id="add-ingredient-form" class="form-group">
                        <input type="text" id="ing-name" placeholder="재료명 (예: 계란)" required>
                        <input type="number" id="ing-qty" placeholder="수량" min="1" value="1" required>
                        <button type="submit" class="btn-primary">추가</button>
                    </form>
                </div>
            </section>

            <section>
                <div class="card ac-card">
                    <div class="card-header-box">
                        <h2>🧊 보관 중인 재료</h2>
                    </div>
                    <ul id="fridge-list" class="ingredient-list">
                        <!-- 자바스크립트로 동적 생성 -->
                    </ul>
                </div>
            </section>
        </div>
    </main>

    <!-- ================= 3. 주방 화면 ================= -->
    <main id="page-kitchen" class="page-view hidden">
        <div class="grid">
            <!-- 레시피 추천/검색 -->
            <section>
                <div class="card ac-card">
                    <div class="flex-between card-header-box">
                        <h2>🍳 레시피 추천 및 검색</h2>
                        <button class="btn-secondary" onclick="recommendRecipes()">선택 재료로 추천받기</button>
                    </div>
                    <p class="guide-txt">아래 냉장고 재료 중 요리에 사용할 재료를 선택해 주세요!</p>

                    <ul id="kitchen-fridge-list" class="ingredient-list" style="margin-bottom: 20px;">
                        <!-- 주방용 재료 선택 체크박스 목록 -->
                    </ul>

                    <div id="recipe-list" class="recipe-list">
                        <p class="empty-msg">
                            위 목록에서 재료를 선택한 후 <br><b>'선택 재료로 추천받기'</b> 버튼을 눌러주세요. 🌿
                        </p>
                    </div>
                </div>
            </section>

            <!-- 레시피 등록 -->
            <section>
                <div class="card ac-card">
                    <h2>📝 레시피 등록 (테스트용)</h2>
                    <form id="add-recipe-form">
                        <div style="margin-bottom: 12px;">
                            <input type="text" id="rec-name" placeholder="레시피 이름 (예: 계란말이)" style="width: 100%;" required>
                        </div>
                        <div style="margin-bottom: 12px;">
                            <textarea id="rec-desc" placeholder="레시피 설명" style="width: 100%; height: 70px; resize: none;" required></textarea>
                        </div>
                        <div id="recipe-ing-inputs">
                            <div class="form-group">
                                <input type="text" placeholder="필요 재료명 (예: 계란)" class="rec-ing-name" required>
                                <input type="number" placeholder="필요 수량" class="rec-ing-qty" min="1" value="1" required>
                            </div>
                        </div>
                        <div class="flex-between" style="margin-top: 10px;">
                            <button type="button" class="btn-outline" onclick="addRecipeIngredientInput()">+ 재료 칸 추가</button>
                            <button type="submit" class="btn-primary">레시피 저장</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>
</div>

<script>
    const API_BASE = '/api/kitchen';

    // 페이지 전환 로직
    function showPage(pageName) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.add('hidden'));
        const topNav = document.getElementById('top-nav');
        const navTitle = document.getElementById('nav-title');

        if (pageName === 'home') {
            document.getElementById('page-home').classList.remove('hidden');
            topNav.classList.add('hidden');
        } else if (pageName === 'fridge') {
            document.getElementById('page-fridge').classList.remove('hidden');
            topNav.classList.remove('hidden');
            navTitle.innerText = '🧊 내 냉장고';
            fetchFridgeIngredients();
        } else if (pageName === 'kitchen') {
            document.getElementById('page-kitchen').classList.remove('hidden');
            topNav.classList.remove('hidden');
            navTitle.innerText = '🍳 주방';
            fetchFridgeIngredients();
        }
    }

    // 1. 냉장고 재료 목록 조회 (GET /api/kitchen/ingredients)
    async function fetchFridgeIngredients() {
        try {
            const res = await fetch(`${API_BASE}/ingredients`);
            const data = await res.json();

            // 냉장고 페이지 목록 갱신
            const fridgeList = document.getElementById('fridge-list');
            // 주방 페이지 체크박스 목록 갱신
            const kitchenFridgeList = document.getElementById('kitchen-fridge-list');

            fridgeList.innerHTML = '';
            kitchenFridgeList.innerHTML = '';

            if (data.length === 0) {
                const emptyMsg = '<li class="empty-msg">냉장고가 비어있습니다.</li>';
                fridgeList.innerHTML = emptyMsg;
                kitchenFridgeList.innerHTML = emptyMsg;
                return;
            }

            data.forEach(item => {
                // 냉장고 단순 수량 조회용
                const liFridge = document.createElement('li');
                liFridge.className = 'ingredient-item';
                liFridge.innerHTML = `
                    <div class="ingredient-info">
                        <strong>🥚 ${item.name}</strong>
                    </div>
                    <span class="badge">수량: ${item.quantity}개</span>
                `;
                fridgeList.appendChild(liFridge);

                // 주방 선택용 체크박스
                const liKitchen = document.createElement('li');
                liKitchen.className = 'ingredient-item';
                liKitchen.innerHTML = `
                    <div class="ingredient-info">
                        <input type="checkbox" value="${item.name}" id="chk-${item.id}">
                        <label for="chk-${item.id}"><strong>🥚 ${item.name}</strong> (보유: ${item.quantity}개)</label>
                    </div>
                `;
                kitchenFridgeList.appendChild(liKitchen);
            });
        } catch (err) {
            console.error('재료 조회 실패:', err);
        }
    }

    // 2. 냉장고 재료 추가 (POST /api/kitchen/ingredients)
    document.getElementById('add-ingredient-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('ing-name').value;
        const quantity = parseInt(document.getElementById('ing-qty').value);

        try {
            const res = await fetch(`${API_BASE}/ingredients`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, quantity })
            });

            if (res.ok) {
                alert('재료가 냉장고에 추가되었습니다!');
                document.getElementById('ing-name').value = '';
                document.getElementById('ing-qty').value = '1';
                fetchFridgeIngredients();
            }
        } catch (err) {
            console.error('재료 추가 실패:', err);
        }
    });

    // 3. 선택한 재료로 레시피 추천 (POST /api/kitchen/recipes/recommend)
    async function recommendRecipes() {
        const checkboxes = document.querySelectorAll('#kitchen-fridge-list input[type="checkbox"]:checked');
        const selectedIngredients = Array.from(checkboxes).map(cb => cb.value);

        if (selectedIngredients.length === 0) {
            alert('추천을 받고 싶은 재료를 최소 하나 이상 선택해 주세요.');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/recipes/recommend`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(selectedIngredients)
            });
            const recipes = await res.json();
            const container = document.getElementById('recipe-list');
            container.innerHTML = '';

            if (recipes.length === 0) {
                container.innerHTML = '<p class="empty-msg">선택한 재료로 만들 수 있는 레시피가 없습니다.</p>';
                return;
            }

            recipes.forEach(recipe => {
                const ingText = recipe.recipeIngredients
                    ? recipe.recipeIngredients.map(ri => `✓ ${ri.name} ${ri.requiredQuantity}개`).join('  ')
                    : '';

                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <h3>🍱 ${recipe.name}</h3>
                    <p>${recipe.description}</p>
                    <div class="recipe-ingredients">${ingText}</div>
                    <div class="recipe-actions">
                        <button class="btn-primary" onclick="useRecipe(${recipe.id})">요리하기 (재료 차감)</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            console.error('레시피 추천 실패:', err);
        }
    }

    // 4. 레시피 사용/요리하기 (POST /api/kitchen/recipes/{recipeId}/use)
    async function useRecipe(recipeId) {
        try {
            const res = await fetch(`${API_BASE}/recipes/${recipeId}/use`, {
                method: 'POST'
            });
            const message = await res.text();
            alert(message);

            fetchFridgeIngredients();
            document.getElementById('recipe-list').innerHTML = `
                <p class="empty-msg">
                    요리가 완료되었습니다! 🍳<br>재료가 차감되었으니 재료를 다시 선택 후 추천받으세요.
                </p>`;
        } catch (err) {
            console.error('레시피 사용 실패:', err);
        }
    }

    // 5. 레시피 입력폼 항목 추가 버튼
    function addRecipeIngredientInput() {
        const container = document.getElementById('recipe-ing-inputs');
        const div = document.createElement('div');
        div.className = 'form-group';
        div.innerHTML = `
            <input type="text" placeholder="필요 재료명" class="rec-ing-name" required>
            <input type="number" placeholder="필요 수량" class="rec-ing-qty" min="1" value="1" required>
        `;
        container.appendChild(div);
    }

    // 6. 샘플 레시피 등록 (POST /api/kitchen/recipes)
    document.getElementById('add-recipe-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('rec-name').value;
        const description = document.getElementById('rec-desc').value;

        const nameInputs = document.querySelectorAll('.rec-ing-name');
        const qtyInputs = document.querySelectorAll('.rec-ing-qty');

        const recipeIngredients = [];
        nameInputs.forEach((input, index) => {
            if (input.value.trim() !== '') {
                recipeIngredients.push({
                    name: input.value,
                    requiredQuantity: parseInt(qtyInputs[index].value)
                });
            }
        });

        const payload = {
            name: name,
            description: description,
            recipeIngredients: recipeIngredients
        };

        try {
            const res = await fetch(`${API_BASE}/recipes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('레시피가 성공적으로 등록되었습니다!');
                document.getElementById('add-recipe-form').reset();
                document.getElementById('recipe-ing-inputs').innerHTML = `
                    <div class="form-group">
                        <input type="text" placeholder="필요 재료명 (예: 계란)" class="rec-ing-name" required>
                        <input type="number" placeholder="필요 수량" class="rec-ing-qty" min="1" value="1" required>
                    </div>
                `;
            }
        } catch (err) {
            console.error('레시피 등록 실패:', err);
        }
    });
</script>
</body>
</html>
