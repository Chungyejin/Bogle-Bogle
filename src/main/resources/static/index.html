<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재료마을 (Ingredient Village)</title>
    <!-- 외부 CSS 스타일시트 연동 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🍳 재료마을 (Ingredient Village)</h1>
        <p>냉장고 속 재료를 관리하고 딱 맞는 레시피를 추천받으세요!</p>
    </header>

    <div class="grid">
        <!-- 왼쪽: 냉장고 재료 관리 -->
        <section>
            <div class="card">
                <h2>신규 재료 추가</h2>
                <form id="add-ingredient-form" class="form-group">
                    <input type="text" id="ing-name" placeholder="재료명 (예: 계란)" required>
                    <input type="number" id="ing-qty" placeholder="수량" min="1" value="1" required>
                    <button type="submit">추가</button>
                </form>
            </div>

            <div class="card">
                <div class="flex-between" style="margin-bottom: 15px;">
                    <h2>🧊 내 냉장고</h2>
                    <button class="btn-secondary" onclick="recommendRecipes()">선택 재료로 레시피 추천</button>
                </div>
                <ul id="fridge-list" class="ingredient-list">
                    <!-- 자바스크립트로 동적 생성 -->
                </ul>
            </div>
        </section>

        <!-- 오른쪽: 레시피 추천 및 등록 -->
        <section>
            <div class="card">
                <h2>🍽️ 추천 레시피</h2>
                <div id="recipe-list" class="recipe-list">
                    <p style="color: #888; text-align: center; padding: 20px;">
                        왼쪽 냉장고에서 재료를 선택한 후 <br><b>'선택 재료로 레시피 추천'</b> 버튼을 눌러주세요.
                    </p>
                </div>
            </div>

            <div class="card">
                <h2>📝 샘플 레시피 등록 (테스트용)</h2>
                <form id="add-recipe-form">
                    <div style="margin-bottom: 10px;">
                        <input type="text" id="rec-name" placeholder="레시피 이름 (예: 계란말이)" style="width: 100%;" required>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <textarea id="rec-desc" placeholder="레시피 설명" style="width: 100%; height: 60px; resize: none;" required></textarea>
                    </div>
                    <div id="recipe-ing-inputs">
                        <div class="form-group">
                            <input type="text" placeholder="필요 재료명 (예: 계란)" class="rec-ing-name" required>
                            <input type="number" placeholder="필요 수량" class="rec-ing-qty" min="1" value="1" required>
                        </div>
                    </div>
                    <div class="flex-between">
                        <button type="button" class="btn-outline" onclick="addRecipeIngredientInput()">+ 재료 칸 추가</button>
                        <button type="submit">레시피 저장</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>

<script>
    const API_BASE = '/api/kitchen';

    // 페이지 로드 시 냉장고 목록 조회
    document.addEventListener('DOMContentLoaded', fetchFridgeIngredients);

    // 1. 냉장고 재료 목록 조회 (GET /api/kitchen/ingredients)
    async function fetchFridgeIngredients() {
        try {
            const res = await fetch(`${API_BASE}/ingredients`);
            const data = await res.json();
            const listEl = document.getElementById('fridge-list');
            listEl.innerHTML = '';

            if (data.length === 0) {
                listEl.innerHTML = '<li style="text-align: center; color: #888; padding: 10px;">냉장고가 비어있습니다.</li>';
                return;
            }

            data.forEach(item => {
                const li = document.createElement('li');
                li.className = 'ingredient-item';
                li.innerHTML = `
                    <div class="ingredient-info">
                        <input type="checkbox" value="${item.name}" id="chk-${item.id}">
                        <label for="chk-${item.id}"><strong>${item.name}</strong></label>
                    </div>
                    <span class="badge">수량: ${item.quantity}</span>
                `;
                listEl.appendChild(li);
            });
        } catch (err) {
            console.error('냉장고 조회 실패:', err);
        }
    }

    // 2. 냉장고 재료 추가 (POST /api/kitchen/ingredients)
    document.getElementById('add-ingredient-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('ing-name').value;
        const quantity = parseInt(document.getElementById('ing-qty').value);

        try {
            const res = await fetch(`${API_BASE}/ingredients`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, quantity })
            });

            if (res.ok) {
                document.getElementById('ing-name').value = '';
                document.getElementById('ing-qty').value = '1';
                fetchFridgeIngredients();
            }
        } catch (err) {
            console.error('재료 추가 실패:', err);
        }
    });

    // 3. 선택한 재료로 레시피 추천 (POST /api/kitchen/recipes/recommend)
    async function recommendRecipes() {
        const checkboxes = document.querySelectorAll('#fridge-list input[type="checkbox"]:checked');
        const selectedIngredients = Array.from(checkboxes).map(cb => cb.value);

        if (selectedIngredients.length === 0) {
            alert('추천을 받고 싶은 재료를 최소 하나 이상 선택해 주세요.');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/recipes/recommend`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(selectedIngredients)
            });
            const recipes = await res.json();
            const container = document.getElementById('recipe-list');
            container.innerHTML = '';

            if (recipes.length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">선택한 재료로 만들 수 있는 레시피가 없습니다.</p>';
                return;
            }

            recipes.forEach(recipe => {
                const ingText = recipe.recipeIngredients
                    ? recipe.recipeIngredients.map(ri => `${ri.name} ${ri.requiredQuantity}개`).join(', ')
                    : '';

                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <h3>${recipe.name}</h3>
                    <p>${recipe.description}</p>
                    <div class="recipe-ingredients"><strong>필요 재료:</strong> ${ingText}</div>
                    <div class="recipe-actions">
                        <button onclick="useRecipe(${recipe.id})">요리하기 (재료 차감)</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            console.error('레시피 추천 실패:', err);
        }
    }

    // 4. 레시피 사용/요리하기 (POST /api/kitchen/recipes/{recipeId}/use)
    async function useRecipe(recipeId) {
        try {
            const res = await fetch(`${API_BASE}/recipes/${recipeId}/use`, {
                method: 'POST'
            });
            const message = await res.text();
            alert(message);

            // 상태 업데이트
            fetchFridgeIngredients();
            document.getElementById('recipe-list').innerHTML = `
                <p style="color: #888; text-align: center; padding: 20px;">
                    요리가 완료되었습니다! <br>재료가 차감되었으니 재료를 다시 선택 후 추천받으세요.
                </p>`;
        } catch (err) {
            console.error('레시피 사용 실패:', err);
        }
    }

    // 5. 샘플 레시피 입력폼 항목 추가 버튼
    function addRecipeIngredientInput() {
        const container = document.getElementById('recipe-ing-inputs');
        const div = document.createElement('div');
        div.className = 'form-group';
        div.innerHTML = `
            <input type="text" placeholder="필요 재료명" class="rec-ing-name" required>
            <input type="number" placeholder="필요 수량" class="rec-ing-qty" min="1" value="1" required>
        `;
        container.appendChild(div);
    }

    // 6. 샘플 레시피 등록 (POST /api/kitchen/recipes)
    document.getElementById('add-recipe-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('rec-name').value;
        const description = document.getElementById('rec-desc').value;

        const nameInputs = document.querySelectorAll('.rec-ing-name');
        const qtyInputs = document.querySelectorAll('.rec-ing-qty');

        const recipeIngredients = [];
        nameInputs.forEach((input, index) => {
            if (input.value.trim() !== '') {
                recipeIngredients.push({
                    name: input.value,
                    requiredQuantity: parseInt(qtyInputs[index].value)
                });
            }
        });

        const payload = {
            name: name,
            description: description,
            recipeIngredients: recipeIngredients
        };

        try {
            const res = await fetch(`${API_BASE}/recipes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('레시피가 등록되었습니다.');
                document.getElementById('add-recipe-form').reset();
                document.getElementById('recipe-ing-inputs').innerHTML = `
                    <div class="form-group">
                        <input type="text" placeholder="필요 재료명 (예: 계란)" class="rec-ing-name" required>
                        <input type="number" placeholder="필요 수량" class="rec-ing-qty" min="1" value="1" required>
                    </div>
                `;
            }
        } catch (err) {
            console.error('레시피 등록 실패:', err);
        }
    });
</script>
</body>
</html>
